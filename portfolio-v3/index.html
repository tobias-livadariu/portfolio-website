<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The startup cover waits for the 3D menu, which suspends on these two
         typefaces; without a hint they are only discovered after the main
         bundle has downloaded and run. -->
    <link
      rel="preload"
      as="fetch"
      crossorigin
      href="/fonts/press-start-2p/press-start-2p.typeface.json"
    />
    <link
      rel="preload"
      as="fetch"
      crossorigin
      href="/fonts/pixel-emulator/pixel-emulator.typeface.json"
    />
    <title>Tobias Livadariu</title>
    <meta
      name="description"
      content="Tobias Livadariu is a Software Engineering student at the University of Waterloo. His portfolio, résumé and contact details can be found here."
    />
    <meta name="theme-color" content="#070b14" />
    <link rel="canonical" href="https://tobias-livadariu.online/portfolio" />
    <!-- The card that chat apps, LinkedIn and search results show for a link
         to the site. These readers do not run scripts and need full
         addresses, so the site's address is written out here. The picture is
         made by `npm run link-preview`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tobias Livadariu" />
    <meta property="og:title" content="Tobias Livadariu" />
    <meta
      property="og:description"
      content="Software Engineering student at the University of Waterloo. Portfolio, résumé and contact, set in a pixel-art starfield."
    />
    <meta
      property="og:url"
      content="https://tobias-livadariu.online/portfolio"
    />
    <meta
      property="og:image"
      content="https://tobias-livadariu.online/portfolio/images/link-preview.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The site's landing view: “Hey, I'm Tobias Livadariu” in orange pixel lettering above a menu, over a starfield full of pixel-art planets."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
